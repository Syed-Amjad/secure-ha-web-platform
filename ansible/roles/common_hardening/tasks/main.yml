---
# NOTE: the guide's draft used ansible.builtin.dnf (RHEL family) while the rest
# of the project runs Ubuntu 24.04. Converted to apt. firewalld is used rather
# than ufw so `firewall-cmd --get-default-zone` in the acceptance checklist
# still works, and because rich rules express source-scoped rules cleanly.

- name: Wait for cloud-init to release the apt lock
  ansible.builtin.raw: cloud-init status --wait || true
  changed_when: false

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - fail2ban
      - firewalld
      - chrony
      - auditd
      - python3-firewall # required by the ansible.posix.firewalld module
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Enable and start auditd
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

# ---------------------------------------------------------------------------
# Default-deny.
#
# The `drop` zone discards without replying. `block` would REJECT with an ICMP
# error, which is friendlier but confirms the host exists to a scanner.
# ---------------------------------------------------------------------------
- name: Set default zone to drop
  ansible.builtin.command: firewall-cmd --set-default-zone=drop
  register: zone
  changed_when: "'success' in zone.stdout"

- name: Allow SSH from permitted sources only
  ansible.posix.firewalld:
    rich_rule: "rule family='ipv4' source address='{{ item }}' service name='ssh' accept"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ ssh_allowed_sources }}"

- name: Allow the application port from the VPC only
  ansible.posix.firewalld:
    rich_rule: "rule family='ipv4' source address='{{ vpc_cidr }}' port port='{{ nginx_listen_port }}' protocol='tcp' accept"
    permanent: true
    immediate: true
    state: enabled
  when: "'web' in group_names"

- name: Allow MySQL from the VPC only
  ansible.posix.firewalld:
    rich_rule: "rule family='ipv4' source address='{{ vpc_cidr }}' port port='3306' protocol='tcp' accept"
    permanent: true
    immediate: true
    state: enabled
  when: "'db_primary' in group_names or 'db_replica' in group_names"

# ---------------------------------------------------------------------------
# SSH hardening
# ---------------------------------------------------------------------------

# `validate:` runs `sshd -t` against the candidate file BEFORE it is written.
# Without it, a typo here locks you out of a remote host on the next restart —
# the classic way to lose a server permanently.
- name: Harden sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
    validate: "/usr/sbin/sshd -t -f %s"
  loop:
    - { key: "PermitRootLogin", value: "no" }
    - { key: "PasswordAuthentication", value: "no" }
    - { key: "PubkeyAuthentication", value: "yes" }
    - { key: "X11Forwarding", value: "no" }
    - { key: "MaxAuthTries", value: "3" }
    - { key: "ClientAliveInterval", value: "300" }
    - { key: "ClientAliveCountMax", value: "2" }
    - { key: "LoginGraceTime", value: "30" }
    - { key: "PermitEmptyPasswords", value: "no" }
  notify: restart sshd

# AllowTcpForwarding must stay ON for the bastion — ProxyJump IS TCP forwarding,
# and disabling it turns the jump host into a host you can only reach, not pass
# through. Everything behind it gets the hardened setting.
- name: Disable TCP forwarding on non-bastion hosts
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?AllowTcpForwarding"
    line: "AllowTcpForwarding no"
    validate: "/usr/sbin/sshd -t -f %s"
  when: "'bastion' not in group_names"
  notify: restart sshd

- name: Remove Ubuntu cloud-init SSH overrides that undo the hardening
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify: restart sshd

# ---------------------------------------------------------------------------
# Kernel network hardening
# ---------------------------------------------------------------------------
- name: Kernel network hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: "net.ipv4.conf.all.rp_filter", value: "1" }
    - { key: "net.ipv4.conf.all.accept_redirects", value: "0" }
    - { key: "net.ipv4.conf.all.send_redirects", value: "0" }
    - { key: "net.ipv4.conf.all.accept_source_route", value: "0" }
    - { key: "net.ipv4.tcp_syncookies", value: "1" }
    - { key: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
    - { key: "net.ipv4.conf.all.log_martians", value: "1" }

# ---------------------------------------------------------------------------
# fail2ban
# ---------------------------------------------------------------------------
- name: Deploy fail2ban jail
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
